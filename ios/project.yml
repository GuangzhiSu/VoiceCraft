name: VoiceCraft
options:
  bundleIdPrefix: com.guangzhisu
  deploymentTarget:
    iOS: '17.0'
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 0.9.4
settings:
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  VoiceCraft:
    type: application
    platform: iOS
    sources: [VoiceCraft]
    info:
      path: VoiceCraft/Info.plist
      properties:
        CFBundleDisplayName: VoiceCraft
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: VoiceCraft records your voice and saves audio alongside your transcript.
        NSSpeechRecognitionUsageDescription: VoiceCraft uses Apple Speech to show live English captions. Apple may process audio online when on-device recognition is unavailable.
        NSLocalNetworkUsageDescription: Connect to your own Whisper server on your local network.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guangzhisu.VoiceCraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VoiceCraftTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VoiceCraftTests]
    dependencies:
      - target: VoiceCraft
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VoiceCraft:
    build:
      targets:
        VoiceCraft: all
    test:
      targets: [VoiceCraftTests]
