name: VoiceCraft CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_inference:
        description: Download tiny.en and run the real-model smoke test
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: python -c "from faster_whisper import WhisperModel"
      - name: Optional real-model inference
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_inference }}
        working-directory: backend
        env:
          VOICECRAFT_RUN_INFERENCE_TEST: '1'
        run: python -m unittest discover -s tests -p test_integration.py -v
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests in simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild test -project ios/VoiceCraft.xcodeproj -scheme VoiceCraft -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES -resultBundlePath TestResults.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: TestResults.xcresult
